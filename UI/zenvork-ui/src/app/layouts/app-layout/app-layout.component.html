<div class="app-layout">
  <mat-sidenav-container [hasBackdrop]="isMobile">
    <mat-sidenav
      class="app-drawer"
      [mode]="isMobile ? 'over' : 'side'"
      [opened]="isMobile ? drawerOpened : true"
      [disableClose]="!isMobile"
      (closedStart)="closeDrawer()"
    >
      <app-sidebar (navigationSelected)="closeDrawer()" />
    </mat-sidenav>

    <mat-sidenav-content>
      @if (isMobile) {
        <app-topbar [title]="mobilePageTitle" (menuToggle)="toggleDrawer()" />
      }
      <main class="app-content" [class.has-mobile-topbar]="isMobile"><router-outlet /></main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
