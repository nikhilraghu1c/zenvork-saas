<aside class="app-sidebar" aria-label="Application navigation">
  <a class="brand" routerLink="/app/dashboard" (click)="selectNavigation()" aria-label="Zenvork dashboard">
    <span class="brand-mark">Z</span><span>Zenvork</span>
  </a>

  <mat-nav-list>
    @for (group of navigationGroups; track group.label) {
      <p class="nav-group-label">{{ group.label }}</p>
      @for (item of group.items; track item.label) {
        @if (canView(item)) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="is-active"
            (click)="selectNavigation()"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    }
  </mat-nav-list>

  <div class="sidebar-footer">
    <div class="user-chip">
      <span class="avatar" aria-hidden="true">{{ initials }}</span>
      <div>
        <p>{{ userName }}</p>
        <span>Your Business</span>
      </div>
    </div>

    @if (logoutError) {
      <p class="logout-error" role="alert">{{ logoutError }}</p>
    }

    <button mat-button type="button" class="logout-button" [disabled]="loadingLogout" (click)="logout()">
      <mat-icon>logout</mat-icon>
      {{ loadingLogout ? 'Logging Out…' : 'Log Out' }}
    </button>
  </div>
</aside>
