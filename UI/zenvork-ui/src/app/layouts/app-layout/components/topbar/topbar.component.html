<mat-toolbar class="app-topbar">
  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="'navigation.open' | translate"
    (click)="menuToggle.emit()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span class="app-topbar__title">{{ title }}</span>
  <span class="app-topbar__balance" aria-hidden="true"></span>
</mat-toolbar>
