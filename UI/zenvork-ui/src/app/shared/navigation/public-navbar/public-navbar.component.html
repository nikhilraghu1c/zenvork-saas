<header class="navbar">
  <a class="brand" routerLink="/" aria-label="Zenvork home">
    <img class="brand-mark" src="/images/brand/zenvork-mark.webp" alt="" />
    <span class="brand-wordmark">envork</span>
  </a>
  <nav class="nav-links" aria-label="Public navigation">
    <a href="#how-it-works">How it works</a><a href="#business-types">Businesses</a>
  </nav>
  <div class="nav-actions">
    <button
      mat-button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggleTheme()"
    >
      <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>{{ theme.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
    </button>
    <a class="button btn-gradient" routerLink="/login">Log in</a>
  </div>
</header>
