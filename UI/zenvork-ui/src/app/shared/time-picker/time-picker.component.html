<div class="app-time-picker">
  @if (labelPlacement === 'outside') {
    <label class="outside-label" [for]="inputId">
      {{ label }}@if (required) {
        <span class="required-marker" aria-hidden="true">*</span>
      }
    </label>
  }
  <mat-form-field appearance="outline" [subscriptSizing]="subscriptSizing">
    @if (labelPlacement === 'floating') {
      <mat-label>
        {{ label }}@if (required) {
          <span class="required-marker" aria-hidden="true">*</span>
        }
      </mat-label>
    }
    <input
      matInput
      [id]="inputId"
      [matTimepicker]="picker"
      [formControl]="control"
      [placeholder]="placeholder"
      [min]="minTime"
      [max]="maxTime"
      [required]="required"
      [disabled]="disabled || isReadonly"
      [attr.aria-invalid]="errorMessage ? 'true' : null"
      [attr.aria-describedby]="errorMessage ? inputId + '-error' : null"
      (blur)="markTouched()"
    />
    <mat-timepicker-toggle matIconSuffix [for]="picker" [disabled]="disabled || isReadonly" />
    <mat-timepicker #picker [interval]="interval" />
    @if (hint && !errorMessage) {
      <mat-hint>{{ hint }}</mat-hint>
    }
  </mat-form-field>
  @if (errorMessage) {
    <p class="input-error" [id]="inputId + '-error'" role="alert">{{ errorMessage }}</p>
  }
</div>
