<div class="app-input">
  @if (labelPlacement === 'outside') {
    <label class="outside-label" [for]="inputId">
      {{ label }}@if (required) { <span class="required-marker" aria-hidden="true">*</span> }
    </label>
  }

  <mat-form-field appearance="outline" [floatLabel]="floatLabel" [subscriptSizing]="subscriptSizing">
    @if (labelPlacement === 'floating') {
      <mat-label>{{ label }}@if (required) { <span class="required-marker" aria-hidden="true">*</span> }</mat-label>
    }
    <input
      matInput
      [id]="inputId"
      [type]="type"
      [value]="value"
      [placeholder]="placeholder"
      [autocomplete]="autocomplete"
      [required]="required"
      [disabled]="disabled"
      (input)="updateValue($event)"
      (blur)="markTouched()"
    />
    @if (hint && !errorMessage) {
      <mat-hint>{{ hint }}</mat-hint>
    }
  </mat-form-field>

  @if (errorMessage) {
    <p class="input-error" role="alert">{{ errorMessage }}</p>
  }
</div>
