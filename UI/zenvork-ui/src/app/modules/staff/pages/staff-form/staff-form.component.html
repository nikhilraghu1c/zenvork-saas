<section class="staff-form-page" aria-labelledby="staff-form-title">
  <header class="staff-form-page__header">
    <p class="eyebrow">{{ 'staff.team' | translate }}</p>
    <h1 id="staff-form-title">{{ 'staff.addTitle' | translate }}</h1>
    <p>{{ 'staff.formDescription' | translate }}</p>
  </header>

  <form class="staff-form" [formGroup]="staffForm" (ngSubmit)="submit()" novalidate>
    <app-input
      formControlName="name"
      [label]="'staff.fullName' | translate"
      labelPlacement="outside"
      [placeholder]="'staff.fullNamePlaceholder' | translate"
      autocomplete="name"
      [required]="true"
      [errorMessage]="fieldError('name')"
    />
    <app-input
      formControlName="email"
      [label]="'staff.email' | translate"
      labelPlacement="outside"
      type="email"
      [placeholder]="'staff.emailPlaceholder' | translate"
      autocomplete="email"
      [errorMessage]="fieldError('email')"
    />
    <app-input
      formControlName="mobile"
      [label]="'staff.mobile' | translate"
      labelPlacement="outside"
      type="tel"
      [placeholder]="'staff.mobilePlaceholder' | translate"
      autocomplete="tel-national"
      [required]="true"
      [errorMessage]="fieldError('mobile')"
    />
    <app-input
      formControlName="password"
      [label]="'staff.temporaryPassword' | translate"
      labelPlacement="outside"
      type="password"
      [placeholder]="'staff.passwordPlaceholder' | translate"
      autocomplete="new-password"
      [hint]="'staff.passwordHint' | translate"
      [required]="true"
      [errorMessage]="fieldError('password')"
    />
    <app-select
      formControlName="bookingAccessScope"
      [label]="'staff.bookingAccess' | translate"
      labelPlacement="outside"
      [options]="bookingAccessOptions"
      [hint]="'staff.bookingAccessHint' | translate"
    />
    <app-checkbox
      formControlName="canSendReminders"
      [label]="'staff.reminderPermission' | translate"
    />

    @if (serverError) {
      <p class="server-error" role="alert">{{ serverError }}</p>
    }

    <div class="staff-form__actions">
      <app-button type="button" variant="secondary" (clicked)="cancel()">{{
        'staff.cancel' | translate
      }}</app-button>
      <app-button type="submit" [loading]="loading" [disabled]="loading">
        {{ 'staff.create' | translate }}
      </app-button>
    </div>
  </form>
</section>
