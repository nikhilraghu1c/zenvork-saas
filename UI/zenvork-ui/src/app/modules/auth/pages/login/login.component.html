<div class="login-page">
  <section class="login-content" aria-labelledby="login-title">
    <header class="login-header">
      <span class="login-icon" aria-hidden="true"><mat-icon>lock_person</mat-icon></span>
      <p class="eyebrow">Secure Business Access</p>
      <h1 id="login-title">Welcome Back</h1>
      <p>Log in to manage your business.</p>
    </header>

    <div class="login-card">
      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        @if (successMessage) {
          <p class="success-message" role="status">{{ successMessage }}</p>
        }
        <app-input
          formControlName="identifier"
          label="Email or mobile number"
          labelPlacement="outside"
          type="text"
          placeholder="you@business.com or 9876543210"
          autocomplete="username"
          [required]="true"
          [errorMessage]="fieldError('identifier')"
        />
        <app-input
          formControlName="password"
          label="Password"
          labelPlacement="outside"
          type="password"
          placeholder="Your password"
          autocomplete="current-password"
          [required]="true"
          [errorMessage]="fieldError('password')"
        />

        <div class="login-options">
          <app-checkbox formControlName="rememberMe" label="Remember Me" />
          <span class="forgot-password" aria-disabled="true">Forgot Password?</span>
        </div>

        @if (serverError) {
          <p class="server-error" role="alert">{{ serverError }}</p>
        }

        <app-button type="submit" [fullWidth]="true" [loading]="loading">Log In</app-button>
      </form>
    </div>

    <p class="access-note">Private workspace <span aria-hidden="true">•</span> Business owners &amp; staff only</p>
    <p class="register-note">
      Don't have a business account yet? <a routerLink="/register">Create One Free</a>
    </p>
  </section>
</div>
