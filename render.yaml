services:
  - type: web
    runtime: node
    name: zenvork
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci && cd ../UI/zenvork-ui && npm ci && API_URL= npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TKN_SECRET
        generateValue: true
      - key: ACCESS_TKN_EXPIRE
        value: 7d
      - key: CLIENT_ORIGIN
        fromService:
          name: zenvork
          type: web
          envVarKey: RENDER_EXTERNAL_URL
