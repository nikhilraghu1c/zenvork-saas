services:
  - type: web
    runtime: node
    name: zenvork
    region: singapore
    plan: free
    rootDir: backend
    # Angular CLI is a dev dependency, so install it explicitly even though runtime NODE_ENV is production.
    buildCommand: npm ci --include=dev && cd ../UI/zenvork-ui && npm ci --include=dev && API_URL= npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TKN_SECRET
        generateValue: true
      - key: ACCESS_TKN_EXPIRE
        value: 7d
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        sync: false
      - key: AI_CLASSIFIER_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        fromService:
          name: zenvork
          type: web
          envVarKey: RENDER_EXTERNAL_URL
